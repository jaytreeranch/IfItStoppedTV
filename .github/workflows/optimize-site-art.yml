name: optimize-site-art
on:
  push:
    paths:
      - '.github/workflows/optimize-site-art.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Convert approved site art to WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -mt -m 6 -q 82 'assets/scene-gps.png' -o 'assets/scene-gps.webp'
          cwebp -quiet -mt -m 6 -q 82 'assets/scene-roads.png' -o 'assets/scene-roads.webp'
          cwebp -quiet -mt -m 6 -q 82 'assets/scene-logistics.png' -o 'assets/scene-logistics.webp'
          cwebp -quiet -mt -m 6 -q 82 'assets/scene-finance.png' -o 'assets/scene-finance.webp'
          ls -lh assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          git commit -m "Optimize approved website art for web" || exit 0
          git push origin main
