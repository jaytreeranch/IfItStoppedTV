name: import-site-assets
on:
  push:
    paths:
      - '.github/workflows/import-site-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import approved production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --silent --show-error 'https://ucac277253689d0192913a117d4e.dl.dropboxusercontent.com/cd/0/get/DI4kflYWAKkUAP4qjLrTen6qGIoGAIiLfO820UMVu772rHxMuI9f2MAfr_oqGd1Jhvaob3l58nIqdvJrS1gzHN6OnZdVKzQ3ByrLARG6X-s8QkXQEynNgEaQ0s3C-4Cq4pNECnUunBzJ09zS-4kS8VXweW6IpAPxJYW8inN--y3bnA/file?c_luid=b7c2f533' -o 'assets/scene-gps.png'
          curl -L --fail --silent --show-error 'https://uc05254b07e0d4d810ee2358953b.dl.dropboxusercontent.com/cd/0/get/DI4UT6QQrCKnuIxHsdcMuy-xLHFHu-lxjlTL7XiutyK40hvnqBI3f8SBCteUcuqKXlkymeS0fQRuciVDam-m9fYMVbawjbCWCe0Eic_-SSXUToxnNyjLkO4tIl9a-U-EiI2Y5peUIwn4yunWeNJcD2q_ljHIGVvCf263vpQ2uNC-UA/file?c_luid=b7c2f533' -o 'assets/scene-roads.png'
          curl -L --fail --silent --show-error 'https://uc33da895e4474dcc413dcc60322.dl.dropboxusercontent.com/cd/0/get/DI7G1VXQ1BcIkCgi3fBtrFPHAhGJv2xEdiCoeqeUAk9aYERWH2V42qpinnzfPgDo4DYe1_QHPP39NwYqczUtT7EDTQnwmIxvjuUSRCfKJDghUCixq9Cl3fHc7twVCEg1tKy4gs4z0OQ9LQ44ILOjhEky66DuiYh6bXsf3Wop-z9SXg/file?c_luid=b7c2f533' -o 'assets/scene-logistics.png'
          curl -L --fail --silent --show-error 'https://ucdf585aa369d9da92eed3bdbe00.dl.dropboxusercontent.com/cd/0/get/DI5rXtmsByUOTP7B5_Bo7JPwoSDz4Br0N9io3bDUiQj7eIVMWv5tHrr4Wfmnozq-gvPBObBHeAQMADXjMubrrb46NOAJ_unrQNMZjqD09Nj0Twt6n6wkI5GB8QzDH0YUV-g-IzNr8vJLIh6vk4NApwXiyp91oMQEpO_l8dUo8MSdIQ/file?c_luid=b7c2f533' -o 'assets/scene-finance.png'
          file assets/*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Mirror approved production art for website" || exit 0
          git push origin main
