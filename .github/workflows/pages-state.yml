name: pages-state
on:
  push:
    paths:
      - '.github/workflows/pages-state.yml'

permissions:
  contents: read
  pages: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and enforce Pages HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          echo "===== BEFORE ====="
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/pages"
          echo
          echo "===== DNS HEALTH ====="
          curl -sS -i -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/pages/health"
          echo
          echo "===== ENFORCE ATTEMPT ====="
          curl -sS -i -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" "https://api.github.com/repos/$REPO/pages" -d '{"https_enforced":true}'
          echo
          echo "===== AFTER ====="
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/pages"
          echo
